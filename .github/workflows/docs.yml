name: docs

# publishes the documentation to GitHub Pages (imagescript.matmen.dev). release.yml runs it after a release reached
# npm, so the site documents what is on npm; can also be run by hand from the Actions tab
on:
  workflow_call:
    inputs:
      version:
        description: version to document (release.yml passes the released one; empty keeps package.json's)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - run: npm install
    - if: inputs.version != ''
      run: node scripts/version.js "$VERSION"
      env:
        VERSION: ${{ inputs.version }}
    - run: npm run docs

    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
