name: node

# tests every pushed branch, and pull requests from forks (pull requests from branches of this repository are
# already tested by their push); release.yml runs it before publishing
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

# a newer push to the same branch cancels the tests of the previous one
concurrency:
  group: node-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    name: node ${{ matrix.version }} | ${{ matrix.os }}

    strategy:
      matrix:
        version: [22.13.0, 22.x, 24.x, 26.x]
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.version }}

    - run: npm install
    - run: npm test
