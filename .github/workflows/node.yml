name: node

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: node ${{ matrix.version }} | ${{ matrix.os }}

    strategy:
      matrix:
        version: [20.x, 22.x, 23.x, 24.x]
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.version }}

    - run: npm test
