<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>objectBoundingBox clip on sliced image</title>

    <clipPath id="clip1" clipPathUnits="objectBoundingBox">
        <rect id="rect1" x="0.25" y="0.25" width="0.5" height="0.5"/>
    </clipPath>

    <image id="image1" x="50" y="20" width="100" height="160"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#clip1)"
           href="data:image/svg+xml;base64,
PHN2ZyBpZD0ic3ZnMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB3aWR0aD0i
MTIwIiBoZWlnaHQ9IjEwIj48cmVjdCBpZD0icmVjdDIiIHdpZHRoPSIxMjAiIGhlaWdodD0iMTAi
IGZpbGw9IiM0YzgiLz48L3N2Zz4="/>

    <!-- image frame -->
    <rect id="frame" x="50" y="20" width="100" height="160" fill="none" stroke="black"/>
</svg>
